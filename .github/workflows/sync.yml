name: Update minutes
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental: 신규·임시본 / full: 전체 본문 재확인'
        type: choice
        default: incremental
        options:
          - incremental
          - full
permissions:
  contents: write
concurrency:
  group: minutes-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector
        run: python -m unittest discover -s tests
      - name: Collect official minutes
        env:
          SYNC_MODE: ${{ inputs.mode || 'auto' }}
        run: python -u scripts/sync.py --mode "$SYNC_MODE"
      - name: Validate archive
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests
      - name: Publish verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minutes indexes manifest.json reports README.md
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official council minutes"
            git push origin HEAD:main
          fi
      - name: Run summary
        run: |
          echo '## 회의록 갱신 결과' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/latest-sync.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
